<style id="app-style">

<script>
'use strict';

const DOC_KIND = { '01': '세금계산서', '02': '수정세금계산서', '03': '계산서', '04': '수정계산서' };
const DOC_DETAIL = { '01': '', '02': '영세율', '03': '위수탁', '04': '수입', '05': '영세율 위수탁', '06': '수입 납부유예' };
const AMEND_REASON = {
  1: '기재사항 착오·정정', 2: '공급가액 변동', 3: '환입',
  4: '계약의 해제', 5: '내국신용장 사후개설', 6: '착오에 의한 이중발급'
};
const PAY_MEANS = { '10': 'cash', '20': 'check', '30': 'note', '40': 'credit' };
const PURPOSE = { '01': '영수', '02': '청구' };

// ---- XML 읽기 (네임스페이스 접두사와 무관하게 localName으로 찾는다) ----
function kids(el, name) {
  return el ? [...el.children].filter(c => c.localName === name) : [];
}
function at(el, path) {
  for (const step of path.split('/')) {
    if (!el) return null;
    el = kids(el, step)[0] || null;
  }
  return el;
}
function txt(el, path) {
  const node = path ? at(el, path) : el;
  return node ? node.textContent.trim() : '';
}

function decode(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes);
  if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes);
  const head = new TextDecoder('latin1').decode(bytes.subarray(0, 200));
  const label = (head.match(/encoding\s*=\s*["']([^"']+)["']/i) || [])[1] || 'utf-8';
  try {
    return new TextDecoder(label).decode(bytes);
  } catch (e) {
    return new TextDecoder('utf-8').decode(bytes);
  }
}

function party(el) {
  if (!el) return null;
  const org = at(el, 'SpecifiedOrganization');
  const emails = [];
  for (const contact of ['DefinedContact', 'PrimaryDefinedContact', 'SecondaryDefinedContact']) {
    for (const c of kids(el, contact)) emails.push(txt(c, 'URICommunication'));
  }
  return {
    id: txt(el, 'ID'),
    idType: txt(org, 'BusinessTypeCode') || '01',
    branch: txt(org, 'TaxRegistrationID') || txt(el, 'TaxRegistrationID'),
    name: txt(el, 'NameText'),
    ceo: txt(el, 'SpecifiedPerson/NameText'),
    address: txt(el, 'SpecifiedAddress/LineOneText'),
    bizType: txt(el, 'TypeCode'),
    bizItem: txt(el, 'ClassificationCode'),
    emails
  };
}

function parseInvoice(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('XML 형식 오류');
  const root = doc.documentElement;
  if (root.localName !== 'TaxInvoice') throw new Error('세금계산서 XML 아님');
  const d = at(root, 'TaxInvoiceDocument');
  const s = at(root, 'TaxInvoiceTradeSettlement');
  const sum = at(s, 'SpecifiedMonetarySummation');
  const pay = { cash: '', check: '', note: '', credit: '' };
  for (const m of kids(s, 'SpecifiedPaymentMeans')) {
    const key = PAY_MEANS[txt(m, 'TypeCode')];
    if (key) pay[key] = txt(m, 'PaidAmount');
  }
  const lines = kids(root, 'TaxInvoiceTradeLineItem').map(li => ({
    seq: txt(li, 'SequenceNumeric'),
    date: txt(li, 'PurchaseExpiryDateTime'),
    name: txt(li, 'NameText'),
    spec: txt(li, 'InformationText'),
    qty: txt(li, 'ChargeableUnitQuantity'),
    unit: txt(li, 'UnitPrice/UnitAmount'),
    amount: txt(li, 'InvoiceAmount'),
    tax: txt(li, 'TotalTax/CalculatedAmount'),
    note: txt(li, 'DescriptionText')
  })).sort((a, b) => (Number(a.seq) || 0) - (Number(b.seq) || 0));
  return {
    issueId: txt(d, 'IssueID'),
    typeCode: txt(d, 'TypeCode'),
    issueDate: txt(d, 'IssueDateTime'),
    purpose: txt(d, 'PurposeCode'),
    amendCode: txt(d, 'AmendmentStatusCode'),
    originalId: txt(d, 'OriginalIssueID'),
    notes: kids(d, 'DescriptionText').map(n => n.textContent.trim()).filter(Boolean),
    supplier: party(at(s, 'InvoicerParty')),
    buyer: party(at(s, 'InvoiceeParty')),
    broker: party(at(s, 'BrokerParty')),
    charge: txt(sum, 'ChargeTotalAmount'),
    tax: txt(sum, 'TaxTotalAmount'),
    total: txt(sum, 'GrandTotalAmount'),
    pay,
    lines
  };
}

// ---- 표기 ----
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function money(v) {
  if (v === '' || v == null) return '';
  const n = Number(v);
  return Number.isFinite(n) ? n.toLocaleString('ko-KR', { maximumFractionDigits: 6 }) : v;
}
function ymd(v) {
  return /^\d{8}/.test(v) ? `${v.slice(0, 4)}/${v.slice(4, 6)}/${v.slice(6, 8)}` : v;
}
function approval(v) {
  return /^\d{24}$/.test(v) ? `${v.slice(0, 8)}-${v.slice(8, 16)}-${v.slice(16)}` : v;
}
function regNo(p) {
  const id = p.id.replace(/\D/g, '');
  if (p.idType === '02' && id.length === 13) return `${id.slice(0, 6)}-*******`;
  if (id.length === 10) return `${id.slice(0, 3)}-${id.slice(3, 5)}-${id.slice(5)}`;
  return p.id;
}
function kindOf(inv) {
  const major = inv.typeCode.slice(0, 2);
  const detail = DOC_DETAIL[inv.typeCode.slice(2, 4)] || '';
  return {
    title: (DOC_KIND[major] || '세금계산서').replace(/^(수정)?/, '$1전자'),
    detail,
    taxFree: major === '03' || major === '04'
  };
}
function amendText(code) {
  if (!code) return '';
  return AMEND_REASON[parseInt(code, 10)] || code;
}

// 금액 검산: 품목 합계·합계금액·결제수단 합계를 비교해 어긋난 항목만 돌려준다.
function checks(inv, taxFree) {
  const n = v => Math.round(Number(v || 0) * 100);
  const out = [];
  if (inv.lines.length) {
    const lineAmt = inv.lines.reduce((a, l) => a + n(l.amount), 0);
    if (lineAmt !== n(inv.charge)) out.push(`품목 공급가액 합 ${money(lineAmt / 100)} ≠ 공급가액 ${money(inv.charge)}`);
    const lineTax = inv.lines.reduce((a, l) => a + n(l.tax), 0);
    if (!taxFree && lineTax !== n(inv.tax)) out.push(`품목 세액 합 ${money(lineTax / 100)} ≠ 세액 ${money(inv.tax)}`);
  }
  if (inv.total && n(inv.charge) + n(inv.tax) !== n(inv.total)) out.push(`공급가액 + 세액 ${money((n(inv.charge) + n(inv.tax)) / 100)} ≠ 합계금액 ${money(inv.total)}`);
  const paid = Object.values(inv.pay).filter(Boolean);
  const paidSum = paid.reduce((a, v) => a + n(v), 0);
  if (paid.length && paidSum !== n(inv.total)) out.push(`결제 금액 합 ${money(paidSum / 100)} ≠ 합계금액 ${money(inv.total)}`);
  return out;
}

// ---- 서식 그리기 ----
function partyRows(sup, buy) {
  const cell = (v, cls = '') => `<td class="${cls}">${esc(v)}</td>`;
  const sEmails = sup.emails.filter(Boolean);
  const bEmails = buy.emails.filter(Boolean);
  return `
  <tr>
    <th class="side s" rowspan="6">공급자</th>
    <th class="s">등록<br>번호</th>${cell(regNo(sup), 'ctr big')}
    <th class="s tight">종사업장<br>번호</th>${cell(sup.branch, 'ctr')}
    <th class="side b split" rowspan="6">공급받는자</th>
    <th class="b">등록<br>번호</th>${cell(regNo(buy), 'ctr big')}
    <th class="b tight">종사업장<br>번호</th>${cell(buy.branch, 'ctr')}
  </tr>
  <tr>
    <th class="s">상호<br>(법인명)</th>${cell(sup.name)}
    <th class="s">성명</th>${cell(sup.ceo)}
    <th class="b">상호<br>(법인명)</th>${cell(buy.name)}
    <th class="b">성명</th>${cell(buy.ceo)}
  </tr>
  <tr>
    <th class="s">사업장</th><td colspan="3">${esc(sup.address)}</td>
    <th class="b">사업장</th><td colspan="3">${esc(buy.address)}</td>
  </tr>
  <tr>
    <th class="s">업태</th>${cell(sup.bizType)}
    <th class="s">종목</th>${cell(sup.bizItem)}
    <th class="b">업태</th>${cell(buy.bizType)}
    <th class="b">종목</th>${cell(buy.bizItem)}
  </tr>
  <tr>
    <th class="s" rowspan="2">이메일</th>
    <td colspan="3" rowspan="2">${esc(sEmails.join('\n')).replace(/\n/g, '<br>')}</td>
    <th class="b">이메일</th><td colspan="3">${esc(bEmails[0] || '')}</td>
  </tr>
  <tr>
    <th class="b">이메일</th><td colspan="3">${esc(bEmails[1] || '')}</td>
  </tr>`;
}

function brokerTable(b) {
  if (!b || !(b.id || b.name)) return '';
  const th = label => `<th class="k">${label}</th>`;
  return `
  <table>
    <colgroup><col style="width:9%"><col style="width:16%"><col style="width:9%"><col style="width:16%"><col style="width:9%"><col style="width:16%"><col style="width:9%"><col style="width:16%"></colgroup>
    <tr>${th('수탁자<br>등록번호')}<td class="ctr">${esc(regNo(b))}</td>${th('상호')}<td>${esc(b.name)}</td>${th('성명')}<td>${esc(b.ceo)}</td>${th('이메일')}<td>${esc(b.emails.filter(Boolean)[0] || '')}</td></tr>
    <tr>${th('사업장')}<td colspan="3">${esc(b.address)}</td>${th('업태')}<td>${esc(b.bizType)}</td>${th('종목')}<td>${esc(b.bizItem)}</td></tr>
  </table>`;
}

function renderSheet(inv) {
  const kind = kindOf(inv);
  const notes = [...inv.notes];
  if (inv.originalId) notes.push(`당초 승인번호 ${approval(inv.originalId)}`);
  const minRows = 4;
  const rows = inv.lines.map(l => `
    <tr>
      <td class="ctr">${esc(l.date.slice(4, 6))}</td><td class="ctr">${esc(l.date.slice(6, 8))}</td>
      <td>${esc(l.name)}</td><td>${esc(l.spec)}</td>
      <td class="num">${money(l.qty)}</td><td class="num">${money(l.unit)}</td>
      <td class="num">${money(l.amount)}</td>${kind.taxFree ? '' : `<td class="num">${money(l.tax)}</td>`}
      <td>${esc(l.note)}</td>
    </tr>`);
  for (let i = inv.lines.length; i < minRows; i++) {
    rows.push(`<tr>${'<td></td>'.repeat(kind.taxFree ? 8 : 9)}</tr>`);
  }
  const itemCols = kind.taxFree
    ? [5, 5, 26, 11, 8, 12, 19, 14]
    : [5, 5, 22, 10, 8, 11, 15, 12, 12];
  const purpose = PURPOSE[inv.purpose];

  return `
  <article class="sheet">
    <table>
      <colgroup><col style="width:52%"><col style="width:14%"><col style="width:34%"></colgroup>
      <tr>
        <td class="title">${esc(kind.title)}${kind.detail ? `<small>(${esc(kind.detail)})</small>` : ''}</td>
        <th>승인번호</th><td class="ctr">${esc(approval(inv.issueId))}</td>
      </tr>
    </table>
    <table>
      <colgroup>
        <col style="width:4%"><col style="width:8.5%"><col style="width:19%"><col style="width:8.5%"><col style="width:10%">
        <col style="width:4%"><col style="width:8.5%"><col style="width:19%"><col style="width:8.5%"><col style="width:10%">
      </colgroup>
      ${partyRows(inv.supplier, inv.buyer)}
    </table>
    ${brokerTable(inv.broker)}
    <table>
      ${kind.taxFree
        ? `<colgroup><col style="width:22%"><col style="width:30%"><col style="width:48%"></colgroup>
           <tr><th>작성일자</th><th>공급가액</th><th>수정사유</th></tr>
           <tr><td class="ctr">${esc(ymd(inv.issueDate))}</td><td class="num">${money(inv.charge)}</td><td class="ctr">${esc(amendText(inv.amendCode))}</td></tr>
           <tr><th>비고</th><td colspan="2" class="multiline">${esc(notes.join('\n'))}</td></tr>`
        : `<colgroup><col style="width:18%"><col style="width:23%"><col style="width:23%"><col style="width:36%"></colgroup>
           <tr><th>작성일자</th><th>공급가액</th><th>세액</th><th>수정사유</th></tr>
           <tr><td class="ctr">${esc(ymd(inv.issueDate))}</td><td class="num">${money(inv.charge)}</td><td class="num">${money(inv.tax)}</td><td class="ctr">${esc(amendText(inv.amendCode))}</td></tr>
           <tr><th>비고</th><td colspan="3" class="multiline">${esc(notes.join('\n'))}</td></tr>`}
    </table>
    <table>
      <colgroup>${itemCols.map(w => `<col style="width:${w}%">`).join('')}</colgroup>
      <tr><th>월</th><th>일</th><th>품목</th><th>규격</th><th>수량</th><th>단가</th><th>공급가액</th>${kind.taxFree ? '' : '<th>세액</th>'}<th>비고</th></tr>
      ${rows.join('')}
    </table>
    <table>
      <colgroup><col style="width:16%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:14%"><col style="width:34%"></colgroup>
      <tr><th>합계금액</th><th>현금</th><th>수표</th><th>어음</th><th>외상미수금</th>
        <td rowspan="2" class="claim">이 금액을 (<b>${esc(purpose || '')}</b>) 함</td></tr>
      <tr><td class="num">${money(inv.total)}</td><td class="num">${money(inv.pay.cash)}</td><td class="num">${money(inv.pay.check)}</td><td class="num">${money(inv.pay.note)}</td><td class="num">${money(inv.pay.credit)}</td></tr>
    </table>
    <div class="foot">XML 변환 열람용 사본 · 발급 확인: 홈택스 제3자 발급사실 조회</div>
  </article>`;
}

// ---- 화면 상태 ----
const sheetsEl = document.getElementById('sheets');
const errorsEl = document.getElementById('errors');
const printBtn = document.getElementById('print');
const saveBtn = document.getElementById('save');
const loaded = [];

function refresh() {
  const has = loaded.length > 0;
  document.body.classList.toggle('has-sheets', has);
  printBtn.disabled = !has;
  saveBtn.disabled = !has;
  fitAll();
}

function fitAll() {
  for (const fit of sheetsEl.querySelectorAll('.fit')) {
    const sheet = fit.firstElementChild;
    const scale = Math.min(1, fit.clientWidth / 684);
    sheet.style.setProperty('--fit', scale.toFixed(4));
  }
}

function addEntry(fileName, inv) {
  const kind = kindOf(inv);
  const warns = checks(inv, kind.taxFree);
  const entry = document.createElement('section');
  entry.className = 'entry';
  entry.innerHTML = `
    <div class="caption"><span class="name">${esc(fileName)}</span><button type="button" aria-label="닫기" title="닫기">×</button></div>
    ${warns.map(w => `<p class="warn">${esc(w)}</p>`).join('')}
    <div class="fit">${renderSheet(inv)}</div>`;
  const item = { fileName, inv, entry };
  entry.querySelector('.caption button').addEventListener('click', () => {
    loaded.splice(loaded.indexOf(item), 1);
    entry.remove();
    refresh();
  });
  loaded.push(item);
  sheetsEl.append(entry);
}

async function openFiles(files) {
  errorsEl.innerHTML = '';
  for (const file of files) {
    try {
      addEntry(file.name, parseInvoice(decode(await file.arrayBuffer())));
    } catch (e) {
      const p = document.createElement('p');
      p.textContent = `${file.name}: ${e.message}`;
      errorsEl.append(p);
    }
  }
  refresh();
}

function baseName() {
  if (loaded.length === 1) {
    const inv = loaded[0].inv;
    return `${kindOf(inv).title}_${approval(inv.issueId) || loaded[0].fileName.replace(/\.xml$/i, '')}`;
  }
  const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  return `전자세금계산서_${loaded.length}건_${today}`;
}

function saveHtml() {
  const css = document.getElementById('app-style').textContent;
  const body = loaded.map(l => `<section class="entry"><div class="fit">${renderSheet(l.inv)}</div></section>`).join('\n');
  const html = `<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(baseName())}</title><style>${css}
.fit { overflow-x: auto; }</style></head>
<body><main class="sheets">${body}</main></body></html>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = `${baseName()}.html`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// 인쇄 창의 'PDF로 저장' 기본 파일명이 문서 제목을 따르므로 잠시 바꾼다.
const appTitle = document.title;
window.addEventListener('beforeprint', () => { if (loaded.length) document.title = baseName(); });
window.addEventListener('afterprint', () => { document.title = appTitle; });

document.getElementById('pick').addEventListener('change', e => {
  openFiles([...e.target.files]);
  e.target.value = '';
});
printBtn.addEventListener('click', () => window.print());
document.getElementById('demo').addEventListener('click', () => {
  errorsEl.innerHTML = '';
  addEntry('예시 (가상 데이터)', parseInvoice(SAMPLE_XML));
  refresh();
});
saveBtn.addEventListener('click', saveHtml);
window.addEventListener('resize', fitAll);

let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  openFiles([...e.dataTransfer.files]);
});
</script>
</body>
</html>
